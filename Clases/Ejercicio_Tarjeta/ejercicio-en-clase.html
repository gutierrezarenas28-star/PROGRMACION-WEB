<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="estilooo.css">
</head>
<body>
    <button class="btn"">Enviar</button>
    <button class="btn btn-peligro">Eliminar</button>

    <section id="contacto">Contacto</section>
    <div>
        <h3>Enlaces (Links)</h3>
        <!-- Enlace nuevo (cambia el href a uno que nunca hayas visitado para probar :link) -->
        <p><a href="https://esta-pagina-no-existe-12345.com" target="_blank">Enlace no visitado (:link)</a></p>
        
        <!-- Enlace visitado (Google es el ejemplo común si ya has entrado antes) -->
        <p><a href="https://google.com" target="_blank">Enlace visitado (:visited)</a></p>
        
        <small>* Pasa el mouse por encima para ver <strong>:hover</strong> y haz clic sostenido para ver <strong>:active</strong>.</small>
    </div>
    <form>
        <p>
            <label>Input requerido e inválido (escribe algo para cambiarlo):</label><br>
            <input type="email" required placeholder="correo@ejemplo.com">
        </p>
        
        <p>
            <label>Input deshabilitado:</label><br>
            <input type="text" disabled value="No puedes escribir aquí">
        </p>
        
        <p>
            <label>Checkbox (cambia de color al marcarlo):</label>
            <input type="checkbox" checked>
        </p>
    </form>
</body>
</html>

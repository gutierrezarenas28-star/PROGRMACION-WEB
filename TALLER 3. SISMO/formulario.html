<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Formulario</title>
    <link rel='stylesheet' href='main.css'>
</head>
<body>
    
    <form>
        <fieldset>
            <legend>Datos Personales</legend>
            <div>
                <label for="nombre">Nombre:</label>
                <input 
                type="text"
                id="nombre"
                name="nombre"
                placeholder="Ingrese su nombre"
                required minlength="3" maxlength="60"
                />
            </div>
            <div>
                <label for="Num Documento">Número de Documento:</label>
                <input 
                type="text"
                id="Num Documento"
                name="Num Documento"
                placeholder="Ingrese su número de documento"
                required pattern="[0-9]{6,10}"
                />
            </div>
            <div>
                <label for="correo">Correo Electrónico:</label>
                <input 
                type="email"
                id="correo"
                name="correo"
                placeholder="Ingrese su correo electrónico"
                required
                />
            </div>
            <div>
                <label for="telefono">Teléfono:</label>
                <input 
                type="tel"
                id="telefono"
                name="telefono"
                placeholder="Ingrese su número de teléfono"
                required pattern="3[0-9]{9}"
                />
            </div>
        </fieldset>
        <fieldset>
            <legend>Ubicación de la afectación</legend>
            <div>
                <label for="departamento">Departamento:</label>
                <select id="departamento" name="departamento" required>
                    <option value="" disabled selected>Seleccione un departamento</option>
                    <optgroup label="Región Caribe">
                        <option value="Cesar">Cesar</option>
                        <option value="atlantico">Atlántico</option>
                        <option value="bolivar">Bolívar</option>
                    </optgroup>

                    <optgroup label="Región Andina">
                        <option value="cundinamarca">Cundinamarca</option>
                        <option value="antioquia">Antioquia</option>
                        <option value="santander">Santander</option>
                    </optgroup>

                    <optgroup label="Región Pacífica">
                        <option value="valle">Valle del Cauca</option>
                        <option value="choco">Chocó</option>
                        <option value="nariño">Nariño</option>
                    </optgroup>

                    <optgroup label="Región Orinoquía">
                        <option value="vaupes">Vaupés</option>
                        <option value="amazonas">Amazonas</option>
                        <option value="guainia">Guainía</option>
                    </optgroup>
                </select>
            </div>

            <div>
                <label for="municipio">Municipio:</label>
                <input 
                type="text"
                id="municipio"
                name="municipio"
                list="municipios" />

                <datalist id="municipios">
                    <option value="Aguachica">
                    <option value="Valledupar">
                    <option value="Codazzi">
                    <option value="Bosconia">
                    <option value="Chimichagua">
                </datalist>
            </div>

            <div>
                <label for="direccion">Dirección:</label>
                <input 
                type="text"
                id="direccion"
                name="direccion"
                required maxlength="120"
                />
            </div>
        </fieldset>

        <fieldset>
            <legend>Información del sismo y afectación</legend>
        </fieldset>
    </form> 

</body>
</html>
